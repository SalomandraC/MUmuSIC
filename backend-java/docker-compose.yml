# Локальный стенд: Postgres + API на Spring.
# Запуск из папки backend-java:   docker compose up -d --build
# Остановка:                      docker compose down        (данные БД остаются в томе pgdata)
#
# Миграции отдельным контейнером больше не нужны: Flyway применяет их при старте API.
# JWT-секреты берутся из backend-java/.env (compose читает его сам), остальное задано ниже.
# Имя проекта и том pgdata те же, что у старого backend, поэтому база с данными подхватится.
name: mumusic

x-db-url: &db-url postgres://mumusic:${POSTGRES_PASSWORD:-mumusic}@postgres:5432/mumusic

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mumusic
      POSTGRES_USER: mumusic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mumusic}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 5433 снаружи, чтобы не конфликтовать с локальным Postgres на 5432
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mumusic -d mumusic"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    image: mumusic-api-java
    environment:
      APP_ENV: production
      PORT: 5050
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: *db-url
      DATABASE_SSL: disable
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?задайте JWT_ACCESS_SECRET в backend-java/.env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?задайте JWT_REFRESH_SECRET в backend-java/.env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-60m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      MEDIA_TOKEN_TTL: ${MEDIA_TOKEN_TTL:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      STORAGE_ROOT: /data/storage
    # Файлы те же, что у старого сервера
    volumes:
      - ../server/storage:/data/storage
    ports:
      - "5050:5050"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:5050/ready"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    # Время на graceful shutdown: дождаться текущих запросов и закрыть пул БД
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
