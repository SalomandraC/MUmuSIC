# Локальный стенд: Postgres + миграции + одна копия API.
# Запуск из папки backend:   docker compose up -d --build
# Остановка:                 docker compose down        (данные БД остаются в томе pgdata)
#
# JWT-секреты берутся из backend/.env (compose читает его сам), остальное задано ниже.
name: mumusic

x-db-url: &db-url postgres://mumusic:${POSTGRES_PASSWORD:-mumusic}@postgres:5432/mumusic

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mumusic
      POSTGRES_USER: mumusic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mumusic}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 5433 снаружи, чтобы не конфликтовать с локальным Postgres на 5432
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mumusic -d mumusic"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Применяет migrations/*.sql и завершается. API стартует только после успешных миграций
  migrate:
    build: .
    image: mumusic-backend
    command: ["node", "dist/db/migrate.js", "up"]
    environment:
      DATABASE_URL: *db-url
      DATABASE_SSL: disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: mumusic-backend
    environment:
      NODE_ENV: production
      PORT: 5050
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: *db-url
      DATABASE_SSL: disable
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?задайте JWT_ACCESS_SECRET в backend/.env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?задайте JWT_REFRESH_SECRET в backend/.env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-60m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      MEDIA_TOKEN_TTL: ${MEDIA_TOKEN_TTL:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      STORAGE_ROOT: /data/storage
    # Файлы пока остаются в server/storage (до переноса в MinIO на 2-м дне)
    volumes:
      - ../server/storage:/data/storage
    ports:
      - "5050:5050"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5050/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    # Время на graceful shutdown: дождаться текущих запросов и закрыть пул БД
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
